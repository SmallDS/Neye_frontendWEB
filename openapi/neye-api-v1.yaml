openapi: 3.0.3
info:
  title: NEye API
  version: 1.0.0
  description: Contract-first API for the NEye optical store platform.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - {name: Health}
  - {name: Auth}
  - {name: Tenants}
  - {name: Users}
  - {name: Customers}
  - {name: Optometry}
  - {name: Fittings}
  - {name: Products}
  - {name: Imports}
  - {name: Settings}
  - {name: Events}
  - {name: Commerce}
  - {name: Inventory}
  - {name: Payments}
paths:
  /health:
    get: {operationId: getHealth, tags: [Health], security: [], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /health/live:
    get: {operationId: getHealthLive, tags: [Health], security: [], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /health/ready:
    get: {operationId: getHealthReady, tags: [Health], security: [], responses: {'200': {$ref: '#/components/responses/Success'}, '503': {$ref: '#/components/responses/Error'}}}
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      security: []
      parameters: [{$ref: '#/components/parameters/PortalType'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses: {'200': {description: Authenticated, content: {application/json: {schema: {$ref: '#/components/schemas/LoginResult'}}}}, '401': {$ref: '#/components/responses/Error'}}
  /auth/me:
    get: {operationId: getCurrentUser, tags: [Auth], responses: {'200': {description: Current user, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentUser'}}}}}}
    patch: {operationId: updateCurrentUser, tags: [Auth], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {description: Updated user, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentUser'}}}}}}
  /auth/password:
    patch: {operationId: changePassword, tags: [Auth], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}}}
  /auth/wechat/config:
    get: {operationId: getWechatPublicConfig, tags: [Auth], security: [], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /auth/wechat/web-sessions:
    post: {operationId: createWechatWebSession, tags: [Auth], security: [], responses: {'201': {$ref: '#/components/responses/Success'}}}
  /auth/wechat/web-sessions/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: pollWechatWebSession, tags: [Auth], security: [], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /auth/wechat/web-sessions/{id}/decision:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: decideWechatWebSession, tags: [Auth], security: [], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /auth/wechat/miniapp-login:
    post: {operationId: wechatMiniappLogin, tags: [Auth], security: [], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /auth/wechat/bind-account:
    post: {operationId: bindWechatAccount, tags: [Auth], security: [], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /auth/wechat/bind-sessions:
    post: {operationId: createWechatBindSession, tags: [Auth], responses: {'201': {$ref: '#/components/responses/Success'}}}
  /auth/wechat/binding:
    post: {operationId: bindCurrentWechat, tags: [Auth], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
    delete: {operationId: unbindCurrentWechat, tags: [Auth], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /tenants:
    get: {operationId: listTenants, tags: [Tenants], parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {$ref: '#/components/responses/Paginated'}}}
    post: {operationId: createTenant, tags: [Tenants], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /tenants/batch-delete:
    post: {operationId: batchDeleteTenants, tags: [Tenants], requestBody: {$ref: '#/components/requestBodies/IDs'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /tenants/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: getTenant, tags: [Tenants], responses: {'200': {$ref: '#/components/responses/Success'}}}
    patch: {operationId: updateTenant, tags: [Tenants], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
    delete: {operationId: deleteTenant, tags: [Tenants], responses: {'204': {description: Deleted}}}
  /tenants/{id}/users:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: listTenantUsers, tags: [Tenants], responses: {'200': {$ref: '#/components/responses/Success'}}}
    post: {operationId: createTenantUser, tags: [Tenants], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}, '201': {$ref: '#/components/responses/Success'}}}
  /tenants/{id}/users/{userId}:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/UserID'}]
    patch: {operationId: updateTenantUser, tags: [Tenants], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
    delete: {operationId: removeTenantUser, tags: [Tenants], responses: {'204': {description: Removed}}}
  /tenants/{id}/users/{userId}/password:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/UserID'}]
    patch: {operationId: resetTenantUserPassword, tags: [Tenants], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /tenants/{id}/admin-password:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch: {operationId: resetTenantAccountPassword, tags: [Tenants], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /users:
    get: {operationId: listUsers, tags: [Users], parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {$ref: '#/components/responses/Paginated'}}}
    post: {operationId: createUser, tags: [Users], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /users/batch-status:
    post: {operationId: updateUsersStatus, tags: [Users], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /users/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: getUser, tags: [Users], responses: {'200': {$ref: '#/components/responses/Success'}}}
    patch: {operationId: updateUser, tags: [Users], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /users/{id}/password:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch: {operationId: resetUserPassword, tags: [Users], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /users/{id}/tenants:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put: {operationId: assignUserTenants, tags: [Users], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /customers:
    get: {operationId: listCustomers, tags: [Customers], parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {$ref: '#/components/responses/Paginated'}}}
    post: {operationId: createCustomer, tags: [Customers], parameters: [{$ref: '#/components/parameters/Tenant'}], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /customers/batch-delete:
    post: {operationId: batchDeleteCustomers, tags: [Customers], parameters: [{$ref: '#/components/parameters/Tenant'}], requestBody: {$ref: '#/components/requestBodies/IDs'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /customers/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}]
    get: {operationId: getCustomer, tags: [Customers], responses: {'200': {$ref: '#/components/responses/Success'}}}
    patch: {operationId: updateCustomer, tags: [Customers], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
    delete: {operationId: deleteCustomer, tags: [Customers], responses: {'204': {description: Deleted}}}
  /optometry-orders:
    get: {operationId: listOptometryOrders, tags: [Optometry], parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {$ref: '#/components/responses/Paginated'}}}
  /customers/{customerId}/optometry-orders:
    parameters: [{$ref: '#/components/parameters/CustomerID'}, {$ref: '#/components/parameters/Tenant'}]
    post: {operationId: createOptometryOrder, tags: [Optometry], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /optometry-orders/batch-delete:
    post: {operationId: batchDeleteOptometryOrders, tags: [Optometry], parameters: [{$ref: '#/components/parameters/Tenant'}], requestBody: {$ref: '#/components/requestBodies/IDs'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /optometry-orders/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}]
    get: {operationId: getOptometryOrder, tags: [Optometry], responses: {'200': {$ref: '#/components/responses/Success'}}}
    patch: {operationId: updateOptometryOrder, tags: [Optometry], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
    delete: {operationId: deleteOptometryOrder, tags: [Optometry], responses: {'204': {description: Deleted}}}
  /fitting-orders:
    get: {operationId: listFittingOrders, tags: [Fittings], parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {$ref: '#/components/responses/Paginated'}}}
  /optometry-orders/{optometryOrderId}/fitting-orders:
    parameters: [{$ref: '#/components/parameters/OptometryID'}, {$ref: '#/components/parameters/Tenant'}]
    post: {operationId: createFittingOrder, tags: [Fittings], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /fitting-orders/batch-delete:
    post: {operationId: batchDeleteFittingOrders, tags: [Fittings], parameters: [{$ref: '#/components/parameters/Tenant'}], requestBody: {$ref: '#/components/requestBodies/IDs'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /fitting-orders/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}]
    get: {operationId: getFittingOrder, tags: [Fittings], responses: {'200': {$ref: '#/components/responses/Success'}}}
    patch: {operationId: updateFittingOrder, tags: [Fittings], parameters: [{$ref: '#/components/parameters/Idempotency'}], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
    delete: {operationId: deleteFittingOrder, tags: [Fittings], responses: {'204': {description: Deleted}}}
  /fitting-orders/{id}/pickup-subscription-qr:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}]
    get: {operationId: getPickupSubscriptionQr, tags: [Fittings], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /fitting-orders/{id}/ready-for-pickup:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}]
    patch: {operationId: markFittingReady, tags: [Fittings], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /fitting-orders/{id}/pickup-notification/retry:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}]
    post: {operationId: retryPickupNotification, tags: [Fittings], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /fitting-orders/{id}/pickup-notification/attempts:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}]
    get: {operationId: listPickupNotificationAttempts, tags: [Fittings], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /public/pickup-subscriptions/context:
    post: {operationId: getPickupSubscriptionContext, tags: [Fittings], security: [], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /public/pickup-subscriptions/subscribe:
    post: {operationId: subscribePickupNotification, tags: [Fittings], security: [], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /product-items:
    get: {operationId: listProductItems, tags: [Products], parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {$ref: '#/components/responses/Paginated'}}}
    post: {operationId: createProductItem, tags: [Products], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /product-items/batch-delete:
    post: {operationId: batchDeleteProductItems, tags: [Products], requestBody: {$ref: '#/components/requestBodies/IDs'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /product-items/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch: {operationId: updateProductItem, tags: [Products], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
    delete: {operationId: deleteProductItem, tags: [Products], responses: {'204': {description: Deleted}}}
  /import-tasks:
    get: {operationId: listImportTasks, tags: [Imports], parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {$ref: '#/components/responses/Paginated'}}}
  /import-tasks/capabilities:
    get: {operationId: getImportCapabilities, tags: [Imports], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /import-tasks/template/customer-optometry:
    get: {operationId: downloadImportTemplate, tags: [Imports], responses: {'200': {description: XLSX template, content: {application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}}}}}
  /import-tasks/customer-optometry:
    post:
      operationId: createCustomerOptometryImport
      tags: [Imports]
      parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Idempotency'}]
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}}}}
      responses: {'201': {$ref: '#/components/responses/Success'}}
  /import-tasks/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}]
    get: {operationId: getImportTask, tags: [Imports], responses: {'200': {$ref: '#/components/responses/Success'}}}
    delete: {operationId: deleteImportTask, tags: [Imports], responses: {'204': {description: Deleted}}}
  /import-tasks/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: cancelImportTask, tags: [Imports], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /import-tasks/{id}/rollback:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: rollbackImportTask, tags: [Imports], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /import-tasks/{id}/error-report:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: downloadImportErrorReport, tags: [Imports], responses: {'200': {description: CSV report, content: {text/csv: {schema: {type: string, format: binary}}}}}}
  /system-settings/wechat-auth:
    get: {operationId: getWechatSettings, tags: [Settings], responses: {'200': {$ref: '#/components/responses/Success'}}}
    patch: {operationId: updateWechatSettings, tags: [Settings], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /system-settings/wechat-pickup-notification:
    get: {operationId: getPickupNotificationSettings, tags: [Settings], responses: {'200': {$ref: '#/components/responses/Success'}}}
    patch: {operationId: updatePickupNotificationSettings, tags: [Settings], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /system-settings/optometry-style:
    get: {operationId: getOptometryStyle, tags: [Settings], parameters: [{$ref: '#/components/parameters/Tenant'}], responses: {'200': {$ref: '#/components/responses/Success'}}}
    patch: {operationId: updateOptometryStyle, tags: [Settings], parameters: [{$ref: '#/components/parameters/Tenant'}], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/overview:
    get: {operationId: getAdminOverview, tags: [Settings], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/system-status:
    get: {operationId: getAdminSystemStatus, tags: [Settings], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/event-logs:
    get: {operationId: listEventLogs, tags: [Events], parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {$ref: '#/components/responses/Paginated'}}}
  /admin/event-logs/retention:
    get: {operationId: getEventLogRetention, tags: [Events], responses: {'200': {$ref: '#/components/responses/Success'}}}
    patch: {operationId: updateEventLogRetention, tags: [Events], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/event-logs/clear-preview:
    post: {operationId: previewEventLogClear, tags: [Events], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/event-logs/clear:
    post: {operationId: clearEventLogs, tags: [Events], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/event-logs/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: getEventLog, tags: [Events], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /commerce/settings:
    get: {operationId: getCommerceSettings, tags: [Commerce], parameters: [{$ref: '#/components/parameters/Tenant'}], responses: {'200': {$ref: '#/components/responses/Success'}}}
    patch: {operationId: updateCommerceSettings, tags: [Commerce], parameters: [{$ref: '#/components/parameters/Tenant'}], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /commerce/payment-status:
    get: {operationId: getCommercePaymentStatus, tags: [Payments], parameters: [{$ref: '#/components/parameters/Tenant'}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /commerce/skus:
    get: {operationId: listTenantSkus, tags: [Inventory], parameters: [{$ref: '#/components/parameters/Tenant'}], responses: {'200': {$ref: '#/components/responses/Success'}}}
    post: {operationId: createTenantSku, tags: [Inventory], parameters: [{$ref: '#/components/parameters/Tenant'}], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /commerce/skus/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}]
    patch: {operationId: updateTenantSku, tags: [Inventory], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /commerce/inventory:
    get: {operationId: listInventoryBalances, tags: [Inventory], parameters: [{$ref: '#/components/parameters/Tenant'}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /commerce/inventory/movements:
    get: {operationId: listInventoryMovements, tags: [Inventory], parameters: [{$ref: '#/components/parameters/Tenant'}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /commerce/inventory/documents:
    get: {operationId: listInventoryDocuments, tags: [Inventory], parameters: [{$ref: '#/components/parameters/Tenant'}], responses: {'200': {$ref: '#/components/responses/Success'}}}
    post: {operationId: createInventoryDocument, tags: [Inventory], parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Idempotency'}], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /commerce/inventory/transfers/{id}/receive:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Idempotency'}]
    post: {operationId: receiveInventoryTransfer, tags: [Inventory], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /commerce/sales:
    get: {operationId: listSalesOrders, tags: [Commerce], parameters: [{$ref: '#/components/parameters/Tenant'}], responses: {'200': {$ref: '#/components/responses/Success'}}}
    post: {operationId: createSalesOrder, tags: [Commerce], parameters: [{$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Idempotency'}], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /commerce/fitting-checkout-queue:
    get: {operationId: listFittingCheckoutQueue, tags: [Commerce], parameters: [{$ref: '#/components/parameters/Tenant'}, {name: state, in: query, schema: {type: string, enum: [pending, paid_for_delivery, refund_due, all], default: pending}}, {name: keyword, in: query, schema: {type: string}}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /commerce/fitting-orders/{id}/sale:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Idempotency'}]
    post: {operationId: createFittingSale, tags: [Commerce], responses: {'200': {$ref: '#/components/responses/Success'}, '201': {$ref: '#/components/responses/Success'}}}
  /commerce/sales/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}]
    get: {operationId: getSalesOrder, tags: [Commerce], responses: {'200': {$ref: '#/components/responses/Success'}}}
    patch: {operationId: updateSalesOrder, tags: [Commerce], parameters: [{$ref: '#/components/parameters/Idempotency'}], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /commerce/sales/{id}/confirm:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Idempotency'}]
    post: {operationId: confirmSalesOrder, tags: [Commerce], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /commerce/sales/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Idempotency'}]
    post: {operationId: cancelSalesOrder, tags: [Commerce], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /commerce/sales/{id}/complete:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Idempotency'}]
    post: {operationId: completeSalesOrder, tags: [Commerce], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /commerce/sales/{id}/receipt:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}]
    get: {operationId: getSalesReceipt, tags: [Commerce], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /commerce/sales/{id}/payments:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Idempotency'}]
    post: {operationId: createPaymentIntent, tags: [Payments], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /commerce/payments:
    get: {operationId: listPaymentTransactions, tags: [Payments], parameters: [{$ref: '#/components/parameters/Tenant'}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /commerce/payment-intents/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}]
    get: {operationId: getPaymentIntent, tags: [Payments], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /commerce/payment-intents/{id}/close:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Idempotency'}]
    post: {operationId: closePaymentIntent, tags: [Payments], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /commerce/payments/{id}/refunds:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/Tenant'}, {$ref: '#/components/parameters/Idempotency'}]
    post: {operationId: refundPayment, tags: [Payments], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /commerce/reports/daily:
    get: {operationId: getDailyCommerceReport, tags: [Commerce], parameters: [{$ref: '#/components/parameters/Tenant'}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/commerce/permissions:
    get: {operationId: listCommercePermissions, tags: [Commerce], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/tenants/{id}/commerce:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: getAdminTenantCommerce, tags: [Commerce], responses: {'200': {$ref: '#/components/responses/Success'}}}
    patch: {operationId: updateAdminTenantCommerce, tags: [Commerce], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/tenants/{id}/users/{userId}/commerce-permissions:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/UserID'}]
    put: {operationId: assignCommercePermissions, tags: [Commerce], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/payment-accounts:
    get: {operationId: listPaymentAccounts, tags: [Payments], responses: {'200': {$ref: '#/components/responses/Success'}}}
    post: {operationId: createPaymentAccount, tags: [Payments], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /admin/payment-accounts/{id}/retire:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: retirePaymentAccount, tags: [Payments], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /admin/settlements:
    get: {operationId: listSettlements, tags: [Payments], responses: {'200': {$ref: '#/components/responses/Success'}}}
    post: {operationId: createSettlement, tags: [Payments], parameters: [{$ref: '#/components/parameters/Idempotency'}], requestBody: {$ref: '#/components/requestBodies/Generic'}, responses: {'201': {$ref: '#/components/responses/Success'}}}
  /admin/settlements/eligible:
    get: {operationId: listSettlementEligible, tags: [Payments], parameters: [{name: tenantId, in: query, required: true, schema: {type: string, format: uuid}}], responses: {'200': {$ref: '#/components/responses/Success'}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    PortalType: {name: X-Portal-Type, in: header, required: false, schema: {type: string, enum: [admin, merchant], default: merchant}}
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    UserID: {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    CustomerID: {name: customerId, in: path, required: true, schema: {type: string, format: uuid}}
    OptometryID: {name: optometryOrderId, in: path, required: true, schema: {type: string, format: uuid}}
    Tenant: {name: X-Tenant-Id, in: header, required: true, schema: {type: string, format: uuid}}
    Idempotency: {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
  requestBodies:
    Generic: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GenericObject'}}}}
    IDs: {required: true, content: {application/json: {schema: {type: object, required: [ids], properties: {ids: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}}, additionalProperties: false}}}}
  responses:
    Success: {description: Successful response, content: {application/json: {schema: {$ref: '#/components/schemas/GenericObject'}}}}
    Paginated: {description: Paginated response, content: {application/json: {schema: {$ref: '#/components/schemas/PageResult'}}}}
    Error: {description: Error response, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    GenericObject: {type: object, additionalProperties: true}
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties: {username: {type: string, minLength: 1, maxLength: 80}, password: {type: string, minLength: 1, maxLength: 256}}
    TenantSummary:
      type: object
      required: [id, code, name, status, assignedAt, permissions]
      properties: {id: {type: string, format: uuid}, code: {type: string}, name: {type: string}, status: {type: string, enum: [active, disabled]}, assignedAt: {type: string, format: date-time}, permissions: {type: array, items: {type: string}}}
    CurrentUser:
      type: object
      required: [id, username, displayName, role, status, mustChangePassword, tenantIds, tenants, wechatBound]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        displayName: {type: string}
        role: {type: string, enum: [admin, staff]}
        status: {type: string, enum: [active, disabled]}
        mustChangePassword: {type: boolean}
        tenantIds: {type: array, items: {type: string, format: uuid}}
        tenants: {type: array, items: {$ref: '#/components/schemas/TenantSummary'}}
        wechatBound: {type: boolean}
    LoginResult:
      type: object
      required: [accessToken, user]
      properties: {accessToken: {type: string}, user: {$ref: '#/components/schemas/CurrentUser'}}
    PageResult:
      type: object
      required: [items, total, page, pageSize]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/GenericObject'}}, total: {type: integer}, page: {type: integer}, pageSize: {type: integer}}
    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties: {code: {type: string}, message: {type: string}, details: {type: object, nullable: true, additionalProperties: true}}
        requestId: {type: string}
