name: Web CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify OpenAPI generated types
        run: |
          pnpm generate:api
          git diff --exit-code -- openapi packages/neye-api/src/generated
      - name: Run all web application tests
        run: pnpm exec vitest run --dom apps/web-admin/src apps/web-merchant/src packages/neye-api/src
      - run: pnpm -F @neye/web-admin run typecheck
      - run: pnpm -F @neye/web-merchant run typecheck
      - run: pnpm -F @neye/web-admin run build
      - run: pnpm -F @neye/web-merchant run build
      - name: Build production Docker images
        run: |
          docker build -f apps/web-admin/Dockerfile -t neye-web-admin:${{ github.sha }} .
          docker build -f apps/web-merchant/Dockerfile -t neye-web-merchant:${{ github.sha }} .
